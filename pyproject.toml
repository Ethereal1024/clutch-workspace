[project]
name = "clutch-workspace"
version = "0.2.0"
description = "Standalone file-inspection CLI: read_file / grep / write_file / edit_file as plain flags-in, text-out commands, executed by a per-workspace daemon."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
clutch-workspace = "clutch_workspace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clutch_workspace"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
